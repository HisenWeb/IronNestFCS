name: Retry ETA source staging patch
on:
  push:
    branches:
      - agent/fire-ready-eta
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fire-ready-eta
      - name: Apply and commit source patch
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/eta-patch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block)
          exec(compile(code, 'eta_patch_embedded.py', 'exec'))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IronNestFCS.Logic/FSC.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "optimize: arbitrate by remaining fire-ready ETA"
          git push origin HEAD:agent/fire-ready-eta
