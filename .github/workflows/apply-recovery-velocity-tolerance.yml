name: Apply recovery velocity tolerance

on:
  push:
    branches:
      - agent/recovery-velocity-tolerance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recovery-velocity-tolerance
          fetch-depth: 0
      - run: python .github/scripts/apply_recovery_velocity_tolerance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recovery-velocity-tolerance.yml .github/scripts/apply_recovery_velocity_tolerance.py
          git add IronNestFCS.Logic/FCS/GunSystem.cs
          git commit -m "fix: tolerate residual elevation velocity after recovery"
          git push origin HEAD:agent/recovery-velocity-tolerance
