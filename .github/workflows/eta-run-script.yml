name: Execute ETA source patch script
on:
  push:
    branches:
      - agent/fire-ready-eta
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fire-ready-eta
      - name: Patch and commit FSC
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 .github/eta_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IronNestFCS.Logic/FSC.cs
          git commit -m "optimize: arbitrate by remaining fire-ready ETA"
          git push origin HEAD:agent/fire-ready-eta
