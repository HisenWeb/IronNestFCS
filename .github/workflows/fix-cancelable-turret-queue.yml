name: Fix cancelable turret queue

on:
  push:
    branches:
      - agent/cancelable-turret-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cancelable-turret-queue
          fetch-depth: 0
      - run: python .github/scripts/fix_cancelable_turret_queue.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-cancelable-turret-queue.yml .github/scripts/fix_cancelable_turret_queue.py
          git add IronNestFCS.Logic/FSC.cs
          git commit -m "fix: cancel stale queued turret reservations"
          git push origin HEAD:agent/cancelable-turret-queue
