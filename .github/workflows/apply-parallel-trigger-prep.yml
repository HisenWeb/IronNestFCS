name: Apply parallel trigger preparation

on:
  push:
    branches:
      - agent/parallel-trigger-prep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parallel-trigger-prep

      - name: Apply reviewed source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ----- TriggerConsole.cs -----
          p = Path('IronNestFCS.Logic/FCS/TriggerConsole.cs')
          s = p.read_text(encoding='utf-8-sig')

          old = '''    private const float PoseTransitionTimeoutSeconds = 2f;\n'''
          new = '''    private const float PoseTransitionTimeoutSeconds = 2f;\n    private const float PostShotResetTimeoutSeconds = 3f;\n    private const int PostShotResetStableSamples = 2;\n'''
          if old not in s:
              raise SystemExit('TriggerConsole constant anchor missing')
          s = s.replace(old, new, 1)

          marker = '''    private void LogPhysicalStates(string reason) {\n'''
          helper = '''    private bool AreAllFireControlsOff() {\n        return TryReadReviewState(_taskPose, out var taskOn, out _) && !taskOn\n               && TryReadReviewState(_bulletPose, out var bulletOn, out _) && !bulletOn\n               && TryReadReviewState(_rotationPose, out var rotationOn, out _) && !rotationOn\n               && TryReadReviewState(_elevationPose, out var elevationOn, out _) && !elevationOn\n               && TryReadReviewState(_readyPose, out var readyOn, out _) && !readyOn\n               && TryReadArmState(_armLeftPose, out var armLeftOn, out _) && !armLeftOn\n               && TryReadArmState(_armRightPose, out var armRightOn, out _) && !armRightOn;\n    }\n\n    /// <summary>\n    /// After a real shot the game clears the shared Review Console and arming lever asynchronously. A promoted\n    /// second shot must not re-enable controls until that automatic reset has actually finished, otherwise the\n    /// tail of the previous reset can switch the new solution back OFF. Wait for two stable all-OFF samples; if\n    /// the game does not settle, actively recover the shared controls to the known OFF baseline before continuing.\n    /// </summary>\n    private IEnumerator WaitForPostShotAutomaticReset() {\n        var deadline = FcsRuntimeClock.Now + PostShotResetTimeoutSeconds;\n        var stableSamples = 0;\n\n        while (FcsRuntimeClock.Now < deadline) {\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            if (AreAllFireControlsOff()) {\n                stableSamples++;\n                if (stableSamples >= PostShotResetStableSamples) {\n                    LogPhysicalStates("post-shot reset settled");\n                    yield break;\n                }\n            }\n            else {\n                stableSamples = 0;\n            }\n            yield return FcsRuntimeClock.WaitForSeconds(0.05f);\n        }\n\n        MelonLogger.Warning(\n            "[FCS] TriggerConsole: post-shot automatic reset did not settle in time; forcing shared controls OFF");\n        yield return EnsureArmState(_armLeft, _armLeftPose, false, "Left");\n        yield return EnsureArmState(_armRight, _armRightPose, false, "Right");\n        yield return EnsureReviewState(_readyFire, _readyPose, false, "ReadyToFire");\n        yield return EnsureReviewState(_elevationCheck, _elevationPose, false, "ElevationCheck");\n        yield return EnsureReviewState(_rotationCheck, _rotationPose, false, "RotationCheck");\n        yield return EnsureReviewState(_bulletCheck, _bulletPose, false, "BulletCheck");\n        yield return EnsureReviewState(_taskCheck, _taskPose, false, "TaskCheck");\n        LogPhysicalStates("post-shot reset recovered");\n    }\n\n'''
          if marker not in s:
              raise SystemExit('TriggerConsole helper marker missing')
          s = s.replace(marker, helper + marker, 1)

          old = '''    public IEnumerator PrepareForNewFireSolution(LeftRight leftRight) {\n        if (_resetPendingAfterBind) {\n            _resetPendingAfterBind = false;\n            yield return ResetPhysicalFireControlsAfterBind();\n            yield break;\n        }\n\n        LogPhysicalStates("before fire solution");\n    }\n'''
          new = '''    public IEnumerator PrepareForNewFireSolution(\n        LeftRight leftRight,\n        bool waitForPreviousShotReset = false) {\n        if (_resetPendingAfterBind) {\n            _resetPendingAfterBind = false;\n            yield return ResetPhysicalFireControlsAfterBind();\n            yield break;\n        }\n\n        if (waitForPreviousShotReset) {\n            MelonLogger.Msg($"[FCS] TriggerConsole: {leftRight} waiting for previous shot control reset");\n            yield return WaitForPostShotAutomaticReset();\n        }\n\n        LogPhysicalStates("before fire solution");\n    }\n'''
          if old not in s:
              raise SystemExit('TriggerConsole PrepareForNewFireSolution anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')

          # ----- FSC.cs -----
          p = Path('IronNestFCS.Logic/FSC.cs')
          s = p.read_text(encoding='utf-8')

          old = '''    private ArtilleryTask? _firePrioritySecond;\n    private ArtilleryTask? _fireLaneCommittedTask;\n    private bool _firePriorityWinnerProvisional;\n'''
          new = '''    private ArtilleryTask? _firePrioritySecond;\n    private ArtilleryTask? _fireLaneCommittedTask;\n    private ArtilleryTask? _triggerResetRequiredTask;\n    private bool _firePriorityWinnerProvisional;\n'''
          if old not in s:
              raise SystemExit('FSC field anchor missing')
          s = s.replace(old, new, 1)

          old = '''        _firePrioritySecond = null;\n        _fireLaneCommittedTask = null;\n        _firePriorityWinnerProvisional = false;\n'''
          new = '''        _firePrioritySecond = null;\n        _fireLaneCommittedTask = null;\n        _triggerResetRequiredTask = null;\n        _firePriorityWinnerProvisional = false;\n'''
          if old not in s:
              raise SystemExit('FSC reset anchor missing')
          s = s.replace(old, new, 1)

          old = '''    private void InvalidateFirePriorityForAbnormalTask(ArtilleryTask task, string reason) {\n        var preservedWinner = _firePriorityWinner != null\n'''
          new = '''    private void InvalidateFirePriorityForAbnormalTask(ArtilleryTask task, string reason) {\n        if (ReferenceEquals(_triggerResetRequiredTask, task))\n            _triggerResetRequiredTask = null;\n\n        var preservedWinner = _firePriorityWinner != null\n'''
          if old not in s:
              raise SystemExit('FSC abnormal cleanup anchor missing')
          s = s.replace(old, new, 1)

          old = '''    private void ReleaseFirePriorityAfterSuccessfulShot(ArtilleryTask task) {\n        var sessionContainedTask = _firePrioritySession != null\n'''
          new = '''    private void ReleaseFirePriorityAfterSuccessfulShot(ArtilleryTask task) {\n        if (ReferenceEquals(_triggerResetRequiredTask, task))\n            _triggerResetRequiredTask = null;\n\n        var sessionContainedTask = _firePrioritySession != null\n'''
          if old not in s:
              raise SystemExit('FSC successful release anchor missing')
          s = s.replace(old, new, 1)

          old = '''                _firePriorityWinner = next;\n                _firePriorityWinnerProvisional = false;\n                _firePriorityStatusText = !string.IsNullOrEmpty(_firePriorityOrderText)\n'''
          new = '''                _firePriorityWinner = next;\n                _firePriorityWinnerProvisional = false;\n                // The previous real shot is still asynchronously clearing the shared Review Console. The promoted\n                // second shot may prepare in parallel with turret rotation, but only after that reset settles.\n                _triggerResetRequiredTask = next;\n                _firePriorityStatusText = !string.IsNullOrEmpty(_firePriorityOrderText)\n'''
          if old not in s:
              raise SystemExit('FSC promoted second anchor missing')
          s = s.replace(old, new, 1)

          # Replace the WaitingForFire -> WaitFire block as one structural unit.
          start = s.find('        task.progress = Progress.WaitingForFire;')
          end = s.find('        if (!gunSys.LastFireObserved) {', start)
          if start < 0 or end < 0:
              raise SystemExit('FSC firing pipeline markers missing')

          replacement = '''        task.progress = Progress.WaitingForFire;\n        var turretWaitTimeout = _sceneInteractor.AutoFire\n            ? AutoTurretWaitTimeoutSeconds\n            : ManualTurretWaitTimeoutSeconds;\n        var turretDeadline = FcsRuntimeClock.Now + turretWaitTimeout;\n\n        // Wait only until this task actually owns the shared fire lane. Once committed, trigger-console preparation\n        // can run in parallel with the potentially long turret slew instead of waiting for turret.Ready.\n        while (true) {\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            if (turret.Committed || turret.Ready || turret.Failed || turret.Canceled) break;\n            if (FcsRuntimeClock.Now >= turretDeadline) break;\n            yield return null;\n        }\n        if (turret.Failed) {\n            AbortTask(leftRight, task, turret, turret.FailureReason);\n            yield break;\n        }\n        if (!turret.Committed && !turret.Ready) {\n            AbortTask(leftRight, task, turret, $"turret reservation timed out after {turretWaitTimeout:F0}s");\n            yield break;\n        }\n\n        var waitForPreviousShotReset = ReferenceEquals(_triggerResetRequiredTask, task);\n        yield return _deskLock.Acquire();\n        try {\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.PrepareForNewFireSolution(leftRight, waitForPreviousShotReset);\n            if (waitForPreviousShotReset && ReferenceEquals(_triggerResetRequiredTask, task))\n                _triggerResetRequiredTask = null;\n\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.ConfirmTask();\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.ConfirmBullet();\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.ConfirmRotation();\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.ConfirmElevation();\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.ReadyToFire();\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            yield return TriggerConsole.Arm(leftRight);\n        }\n        finally {\n            _deskLock.Release();\n        }\n\n        // The Review Console and selected arming lever are now ready while the shared turret may still be moving.\n        // Never auto-fire until the azimuth slew itself has completed successfully.\n        while (true) {\n            yield return FcsRuntimeClock.WaitUntilFocused();\n            if (turret.Ready || turret.Failed || turret.Canceled) break;\n            if (FcsRuntimeClock.Now >= turretDeadline) break;\n            yield return null;\n        }\n        if (turret.Failed) {\n            AbortTask(leftRight, task, turret, turret.FailureReason);\n            yield break;\n        }\n        if (!turret.Ready) {\n            AbortTask(leftRight, task, turret, $"turret rotation timed out after {turretWaitTimeout:F0}s");\n            yield break;\n        }\n\n        try {\n            if (_sceneInteractor.AutoFire) {\n                yield return _deskLock.Acquire();\n                try {\n                    yield return FcsRuntimeClock.WaitUntilFocused();\n                    TriggerConsole.Fire();\n                }\n                finally {\n                    _deskLock.Release();\n                }\n            }\n\n            var fireTimeout = _sceneInteractor.AutoFire\n                ? AutoFireTimeoutSeconds\n                : ManualFireTimeoutSeconds;\n            yield return gunSys.WaitFire(fireTimeout);\n        }\n        finally {\n            ReleaseTurretOnce(turret);\n        }\n\n'''
          s = s[:start] + replacement + s[end:]

          old = '''        public bool Acquired;\n        public bool Ready;\n        public bool Failed;\n'''
          new = '''        public bool Acquired;\n        public bool Committed;\n        public bool Ready;\n        public bool Failed;\n'''
          if old not in s:
              raise SystemExit('FSC reservation field anchor missing')
          s = s.replace(old, new, 1)

          old = '''            if (!CommitFireLane(task, res.Generation)) {\n                ReleaseTurretOnce(res);\n                yield return null;\n                continue;\n            }\n\n            yield return Turret.SetRotation(\n'''
          new = '''            if (!CommitFireLane(task, res.Generation)) {\n                ReleaseTurretOnce(res);\n                yield return null;\n                continue;\n            }\n\n            // Publish ownership before starting the physical slew so RunTaskRoutine can prepare Review/Arm\n            // concurrently. This is only a readiness signal; automatic firing still waits for res.Ready.\n            res.Committed = true;\n\n            yield return Turret.SetRotation(\n'''
          if old not in s:
              raise SystemExit('FSC commit/rotation anchor missing')
          s = s.replace(old, new, 1)

          # Basic guardrails against accidental duplicate/partial patching.
          if s.count('PrepareForNewFireSolution(leftRight, waitForPreviousShotReset)') != 1:
              raise SystemExit('FSC parallel trigger prep wiring count unexpected')
          if s.count('public bool Committed;') != 1:
              raise SystemExit('FSC committed flag wiring count unexpected')
          if s.count('_triggerResetRequiredTask = next;') != 1:
              raise SystemExit('FSC post-shot reset requirement wiring count unexpected')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-parallel-trigger-prep.yml
          git add IronNestFCS.Logic/FSC.cs IronNestFCS.Logic/FCS/TriggerConsole.cs
          git commit -m "fix: prepare second-shot trigger controls during turret slew"
          git push origin HEAD:agent/parallel-trigger-prep
