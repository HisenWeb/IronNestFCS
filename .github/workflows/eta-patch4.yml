name: Finish ETA source staging patch
on:
  push:
    branches:
      - agent/fire-ready-eta
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fire-ready-eta
      - name: Apply and commit source patch
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_lines = Path('.github/workflows/eta-patch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow_lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(workflow_lines)) if workflow_lines[i].strip() == 'PY')
          block = workflow_lines[start + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block)
          marker = "old = '''    private sealed class FirePriorityCandidate {"
          cut = code.index(marker)
          exec(compile(code[:cut], 'eta_patch_prefix.py', 'exec'), globals())

          path = Path('IronNestFCS.Logic/FSC.cs')
          text = path.read_text(encoding='utf-8-sig')
          candidate_pattern = re.compile(
              r'    private sealed class FirePriorityCandidate \{.*?\n    \}\n\n    private sealed class FirePrioritySession',
              re.S)
          candidate_replacement = '''    private sealed class FireReadyEstimate {
        public bool LoadKnown { get; }
        public string LoadLabel { get; }
        public float LoadSeconds { get; }
        public float ElevationSeconds { get; }
        public float AzimuthSeconds { get; }
        public float LocalSeconds { get; }
        public float TotalSeconds { get; }
        public float AzimuthDelta { get; }
        public float ElevationDelta { get; }
        public float AlignmentScore { get; }

        public FireReadyEstimate(
            bool loadKnown,
            string loadLabel,
            float loadSeconds,
            float elevationSeconds,
            float azimuthSeconds,
            float localSeconds,
            float totalSeconds,
            float azimuthDelta,
            float elevationDelta,
            float alignmentScore) {
            LoadKnown = loadKnown;
            LoadLabel = loadLabel;
            LoadSeconds = loadSeconds;
            ElevationSeconds = elevationSeconds;
            AzimuthSeconds = azimuthSeconds;
            LocalSeconds = localSeconds;
            TotalSeconds = totalSeconds;
            AzimuthDelta = azimuthDelta;
            ElevationDelta = elevationDelta;
            AlignmentScore = alignmentScore;
        }
    }

    private sealed class FirePriorityCandidate {
        public LeftRight Side { get; }
        public ArtilleryTask Task { get; }
        public float SolvedAt { get; }
        public int Generation { get; }
        public GunTaskMode Mode { get; }

        public FirePriorityCandidate(
            LeftRight side,
            ArtilleryTask task,
            float solvedAt,
            int generation,
            GunTaskMode mode) {
            Side = side;
            Task = task;
            SolvedAt = solvedAt;
            Generation = generation;
            Mode = mode;
        }
    }

    private sealed class FirePrioritySession'''
          text, count = candidate_pattern.subn(candidate_replacement, text, count=1)
          assert count == 1, count
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IronNestFCS.Logic/FSC.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "optimize: arbitrate by remaining fire-ready ETA"
          git push origin HEAD:agent/fire-ready-eta
