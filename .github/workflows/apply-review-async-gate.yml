name: Apply review async gate

on:
  push:
    branches:
      - feature/physical-fire-settlement

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run review async patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/physical-fire-settlement

      - name: Apply patch
        run: python3 tools/apply_review_async_gate.py

      - name: Commit branch update
        run: |
          git config user.name "HisenWeb"
          git config user.email "actions@users.noreply.github.com"
          git add IronNestFCS.Logic/Execution/FirePlanExecutor.cs IronNestFCS.Logic/FCS/TriggerConsole.cs
          git commit -m "fix: dispatch review controls once with 1.2s arm lead"
          git push origin HEAD:feature/physical-fire-settlement
