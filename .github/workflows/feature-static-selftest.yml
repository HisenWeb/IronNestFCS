name: Feature static self-test

on:
  push:
    branches:
      - feature/physical-fire-settlement

jobs:
  syntax-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse all C# sources with Roslyn
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fcs-syntax
          dotnet new console -n FcsSyntax -o /tmp/fcs-syntax --framework net8.0 >/dev/null
          cd /tmp/fcs-syntax
          dotnet add package Microsoft.CodeAnalysis.CSharp --version 4.11.0 >/dev/null
          cat > Program.cs <<'CS'
          using Microsoft.CodeAnalysis;
          using Microsoft.CodeAnalysis.CSharp;

          var root = Environment.GetEnvironmentVariable("GITHUB_WORKSPACE")
                     ?? throw new InvalidOperationException("GITHUB_WORKSPACE missing");
          var files = Directory.EnumerateFiles(root, "*.cs", SearchOption.AllDirectories)
              .Where(path => !path.Contains($"{Path.DirectorySeparatorChar}bin{Path.DirectorySeparatorChar}")
                          && !path.Contains($"{Path.DirectorySeparatorChar}obj{Path.DirectorySeparatorChar}"))
              .OrderBy(path => path)
              .ToArray();

          var failed = false;
          foreach (var file in files)
          {
              var text = File.ReadAllText(file);
              var tree = CSharpSyntaxTree.ParseText(text,
                  new CSharpParseOptions(LanguageVersion.Latest), file);
              var errors = tree.GetDiagnostics()
                  .Where(d => d.Severity == DiagnosticSeverity.Error)
                  .ToArray();
              foreach (var error in errors)
              {
                  failed = true;
                  Console.Error.WriteLine(error);
              }
          }

          Console.WriteLine($"Parsed {files.Length} C# source files.");
          if (failed)
              Environment.Exit(1);
          CS
          dotnet run --no-restore

      - name: Check feature invariants
        shell: bash
        run: |
          set -euo pipefail
          EXEC=IronNestFCS.Logic/Execution/FirePlanExecutor.cs
          TRIGGER=IronNestFCS.Logic/FCS/TriggerConsole.cs
          DISPATCH=IronNestFCS.Logic/Scheduling/TaskDispatcher.cs

          ! grep -q 'WaitBackToIdle' "$EXEC"
          ! grep -q 'WaitFire(' "$EXEC"
          grep -q 'SameAzimuthToleranceDegrees = 0.01f' "$EXEC"
          grep -q 'FireSettlementBufferFrames = 3' "$EXEC"
          grep -q 'SettleObservedShots' "$EXEC"
          grep -q 'CompleteReviewProtocol' "$TRIGGER"
          grep -q 'ArmSelected' "$TRIGGER"
          grep -q 'WaitForPhysicalPlanningOpportunity' "$DISPATCH"
          echo 'Feature invariants present.'
