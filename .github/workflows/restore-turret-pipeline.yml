name: Restore turret pipeline

on:
  push:
    branches:
      - agent/arm-after-azimuth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arm-after-azimuth
          fetch-depth: 0
      - run: python .github/scripts/restore_turret_pipeline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-turret-pipeline.yml .github/scripts/restore_turret_pipeline.py
          git add IronNestFCS.Logic/FCS/TriggerConsole.cs IronNestFCS.Logic/FSC.cs
          git commit -m "fix: restore queued turret handoff pipeline"
          git push origin HEAD:agent/arm-after-azimuth
