name: Apply prep timing probe

on:
  push:
    branches:
      - agent/prep-timing-probe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prep-timing-probe
          fetch-depth: 0
      - run: python .github/scripts/apply_prep_timing_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-prep-timing-probe.yml .github/scripts/apply_prep_timing_probe.py
          git add IronNestFCS.Logic/FSC.cs
          git commit -m "chore: trace post-arbitration preparation timing"
          git push origin HEAD:agent/prep-timing-probe
