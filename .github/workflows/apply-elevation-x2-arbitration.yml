name: Apply elevation x2 arbitration

on:
  push:
    branches:
      - agent/elevation-x2-arbitration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/elevation-x2-arbitration
          fetch-depth: 0
      - run: python .github/scripts/apply_elevation_x2_arbitration.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-elevation-x2-arbitration.yml .github/scripts/apply_elevation_x2_arbitration.py
          git add IronNestFCS.Logic/FSC.cs
          git commit -m "fix: normalize fire arbitration by slew speed"
          git push origin HEAD:agent/elevation-x2-arbitration
